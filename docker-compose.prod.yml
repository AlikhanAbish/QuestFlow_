version: '3.9'

services:
  db:
    image: postgres:16-alpine
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER}']
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  django:
    build: 
      context: .
      dockerfile: docker/django/Dockerfile
    env_file: .env
    command: >
      sh -c 'python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4'
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - '8000:8000'

  celery:
    build: 
      context: .
      dockerfile: docker/celery/Dockerfile
    env_file: .env
    command: >
      sh -c '/app/scripts/wait_for_db.sh && celery -A config worker -l info -Q celery,telegram'
    depends_on:
      - django
      - redis

  celery-beat:
    build: 
      context: .
      dockerfile: docker/celery/Dockerfile
    env_file: .env
    command: >
      sh -c '/app/scripts/wait_for_db.sh && celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler'
    depends_on:
      - django
      - redis

  telegram-bot-setup:
    build: 
      context: .
      dockerfile: docker/telegram/Dockerfile
    env_file: .env
    command: >
      sh -c '/app/scripts/wait_for_db.sh && python manage.py telegram_setup_webhook'
    depends_on:
      - django
      - redis
    restart: "no"

  nginx:
    build: ./docker/nginx
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - django

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
