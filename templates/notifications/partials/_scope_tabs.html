<button type="button"
        hx-get="{% url 'notifications:list' %}?filter={{ active_filter }}&scope=all"
        hx-target="#notif-list"
        hx-swap="innerHTML"
        class="px-4 py-1.5 rounded-xl text-sm font-medium border transition-all duration-200 {% if active_scope == 'all' %}bg-violet-500/20 text-violet-200 border-violet-400/40 shadow-sm shadow-violet-500/20 ring-1 ring-violet-400/30{% else %}bg-white/5 text-zinc-400 hover:text-white hover:bg-white/10 border-transparent{% endif %}">
    All
    {% if unread_count %}<span class="ml-1 opacity-80">({{ unread_count }})</span>{% endif %}
</button>

    Personal
    {% if personal_unread %}<span class="ml-1 opacity-80">({{ personal_unread }})</span>{% endif %}
</button>

    Team
    {% if team_unread %}<span class="ml-1 opacity-80">({{ team_unread }})</span>{% endif %}
</button>
