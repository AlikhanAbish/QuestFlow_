{% for key, label in filter_tabs %}
<button type="button"
        hx-get="{% url 'notifications:list' %}?filter={{ key }}&scope={{ active_scope }}"
        hx-target="#notif-list"
        hx-swap="innerHTML"
        class="px-4 py-1.5 rounded-xl text-sm font-medium border transition-all duration-200 {% if active_filter == key %}bg-indigo-500/20 text-indigo-200 border-indigo-400/40 shadow-sm shadow-indigo-500/20 ring-1 ring-indigo-400/30{% else %}bg-white/5 text-zinc-400 hover:text-white hover:bg-white/10 border-transparent{% endif %}">
    {{ label }}
</button>
{% endfor %}
