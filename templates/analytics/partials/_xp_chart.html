<div class="w-full flex flex-col h-full animate-fade-in"
     x-data="{
        initChart() {
            if (typeof Chart === 'undefined') {
                console.error('Chart.js is not loaded.');
                return;
            }
            const ctx = this.$refs.canvas.getContext('2d');
            
            // Create gradient for the area chart
            const gradient = ctx.createLinearGradient(0, 0, 0, 300);
            gradient.addColorStop(0, 'rgba(139, 92, 246, 0.4)'); // purple-500
            gradient.addColorStop(1, 'rgba(139, 92, 246, 0.0)');

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: {{ labels_json|safe }},
                    datasets: [{
                        label: 'Team XP Earned',
                        data: {{ data_json|safe }},
                        borderColor: '#8B5CF6', // purple-500
                        backgroundColor: gradient,
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4, // smooth curve
                        pointBackgroundColor: '#8B5CF6',
                        pointBorderColor: '#ffffff',
                        pointHoverBackgroundColor: '#ffffff',
                        pointHoverBorderColor: '#8B5CF6',
                        pointRadius: 0,
                        pointHoverRadius: 4,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            mode: 'index',
                            intersect: false,
                            backgroundColor: 'rgba(17, 24, 39, 0.8)',
                            titleColor: '#fff',
                            bodyColor: '#fff',
                            borderColor: 'rgba(255,255,255,0.1)',
                            borderWidth: 1
                        }
                    },
                    scales: {
                        y: { 
                            beginAtZero: true, 
                            ticks: { precision: 0 },
                            grid: { borderDash: [4, 4] }
                        },
                        x: { 
                            grid: { display: false },
                            ticks: { maxTicksLimit: 10 }
                        }
                    },
                    interaction: {
                        mode: 'nearest',
                        axis: 'x',
                        intersect: false
                    }
                }
            });
        }
     }"
     x-init="initChart()">
    
    <div class="flex justify-between items-end mb-4">
        <div>
            <h3 class="text-sm font-bold text-gray-800 dark:text-gray-200 uppercase tracking-wider">XP Dynamics</h3>
            <p class="text-xs text-gray-500 dark:text-gray-400 mt-1">Daily XP earned by the team over 30 days</p>
        </div>
        <div class="text-right">
            <p class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-wider">Period Total</p>
            <p class="text-2xl font-extrabold text-purple-600 dark:text-purple-400">+{{ total_xp }} XP</p>
        </div>
    </div>
    
    <div class="relative w-full flex-grow min-h-[220px]">
        <canvas x-ref="canvas"></canvas>
    </div>
</div>
