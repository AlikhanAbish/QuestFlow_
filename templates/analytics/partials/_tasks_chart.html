<div class="flex flex-col md:flex-row gap-6 w-full animate-fade-in"
     x-data="{
        initCharts() {
            if (typeof Chart === 'undefined') {
                console.error('Chart.js is not loaded.');
                return;
            }
            const doughnutCtx = this.$refs.doughnutCanvas.getContext('2d');
            new Chart(doughnutCtx, {
                type: 'doughnut',
                data: {
                    labels: ['On Time', 'Overdue'],
                    datasets: [{
                        data: [{{ metrics.on_time }}, {{ metrics.overdue }}],
                        backgroundColor: ['#10B981', '#EF4444'], // green-500, red-500
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom', labels: { usePointStyle: true, boxWidth: 8 } }
                    },
                    cutout: '75%'
                }
            });

            const barCtx = this.$refs.barCanvas.getContext('2d');
            new Chart(barCtx, {
                type: 'bar',
                data: {
                    labels: {{ daily_labels_json|safe }},
                    datasets: [{
                        label: 'Completed Tasks',
                        data: {{ daily_data_json|safe }},
                        backgroundColor: '#6366F1', // indigo-500
                        borderRadius: 4,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: { 
                            beginAtZero: true, 
                            ticks: { precision: 0 },
                            grid: { borderDash: [4, 4] }
                        },
                        x: {
                            grid: { display: false }
                        }
                    }
                }
            });
        }
     }"
     x-init="initCharts()">
    
    <div class="w-full md:w-1/3 flex flex-col h-64">
        <h3 class="text-sm font-bold text-gray-800 dark:text-gray-200 mb-2 uppercase tracking-wider">Status</h3>
        <div class="relative w-full flex-grow">
            <canvas x-ref="doughnutCanvas"></canvas>
            <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none pb-8">
                <span class="text-2xl font-bold text-gray-900 dark:text-white">{{ on_time_pct }}%</span>
                <span class="text-xs text-gray-500">On Time</span>
            </div>
        </div>
    </div>
    
    <div class="w-full md:w-2/3 flex flex-col h-64">
        <h3 class="text-sm font-bold text-gray-800 dark:text-gray-200 mb-2 uppercase tracking-wider">Daily Activity (30 Days)</h3>
        <div class="relative w-full flex-grow">
            <canvas x-ref="barCanvas"></canvas>
        </div>
    </div>
</div>
