<div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden">
    <div class="p-4 border-b border-slate-100 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 flex justify-between items-center">
        <h3 class="font-bold text-slate-800 dark:text-white flex items-center gap-2">
            <svg class="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
            My Badges
        </h3>
        <span class="text-xs font-medium px-2 py-1 bg-indigo-100 text-indigo-600 rounded-full dark:bg-indigo-900/30 dark:text-indigo-400">
            {{ badges|length }} Earned
        </span>
    </div>
    
    <div class="p-4 grid grid-cols-2 sm:grid-cols-3 gap-3 max-h-80 overflow-y-auto">
        {% for ub in badges %}
        <div class="flex flex-col items-center p-3 rounded-lg bg-slate-50 dark:bg-slate-700/30 border border-slate-100 dark:border-slate-700 hover:shadow-md transition-shadow">
            <div class="w-14 h-14 bg-indigo-100 dark:bg-indigo-900/50 rounded-full mb-2 flex items-center justify-center border-2 border-indigo-200 dark:border-indigo-800 text-indigo-600 dark:text-indigo-400 shadow-sm">
                {% if ub.badge.icon %}
                    <img src="{{ ub.badge.icon.url }}" alt="{{ ub.badge.name }}" class="w-8 h-8 object-contain">
                {% else %}
                    <!-- Default Badge Icon -->
                    <svg class="w-7 h-7" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1.323l3.954 1.582 1.599-.8a1 1 0 01.894 1.79l-1.233.616 1.738 5.42a1 1 0 01-.285 1.05A3.989 3.989 0 0115 15a3.989 3.989 0 01-2.667-1.019 1 1 0 01-.285-1.05l1.715-5.349L11 6.477V16h2a1 1 0 110 2H7a1 1 0 110-2h2V6.477L6.237 7.582l1.715 5.349a1 1 0 01-.285 1.05A3.989 3.989 0 015 15a3.989 3.989 0 01-2.667-1.019 1 1 0 01-.285-1.05l1.738-5.42-1.233-.617a1 1 0 01.894-1.788l1.599.799L9 4.323V3a1 1 0 011-1z" clip-rule="evenodd"></path></svg>
                {% endif %}
            </div>
            <h4 class="text-xs font-semibold text-slate-800 dark:text-slate-200 text-center">{{ ub.badge.name }}</h4>
        </div>
        {% empty %}
        <div class="col-span-full py-6 text-center text-slate-500 text-sm">
            You haven't earned any badges yet. Complete tasks to unlock!
        </div>
        {% endfor %}
    </div>
</div>
