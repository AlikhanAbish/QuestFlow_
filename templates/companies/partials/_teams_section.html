<div id="teams-section" class="space-y-6">
    <div>
        <h3 class="text-lg font-semibold text-white mb-3">Teams</h3>
        {% if teams %}
        <ul class="space-y-2 mb-4">
            {% for team in teams %}
            <li class="flex items-center gap-2 px-4 py-2 rounded-xl bg-white/5 border border-white/10 text-sm text-gray-200">
                <svg class="w-4 h-4 text-primary-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z">
                    </path>
                </svg>
                {{ team.name }}
            </li>
            {% endfor %}
        </ul>
        {% else %}
        <p class="text-sm text-gray-500 mb-4">No teams yet. Create one to assign invites to a team.</p>
        {% endif %}
    </div>

    <form method="post" action="{% url 'companies:team_create' %}" class="flex flex-col sm:flex-row gap-3 items-end max-w-lg">
        {% csrf_token %}
        <div class="flex-grow w-full">
            <label for="{{ team_form.name.id_for_label }}" class="form-label">{{ team_form.name.label }}</label>
            {{ team_form.name }}
            {% if team_form.name.errors %}
            <div class="errorlist">{{ team_form.name.errors }}</div>
            {% endif %}
        </div>
        <button type="submit" class="btn-primary whitespace-nowrap">Add team</button>
    </form>
</div>
