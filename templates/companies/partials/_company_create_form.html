<div id="company-create-form" class="max-w-lg">
    <p class="text-sm text-gray-400 mb-6">
        You are not assigned to a company yet. Create one to invite managers and employees.
    </p>

    <form method="post" action="{% url 'companies:company_create' %}" class="space-y-5">
        {% csrf_token %}

        {% for field in create_form %}
        <div>
            <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
            {{ field }}
            {% if field.help_text %}
            <p class="text-xs text-gray-500 mt-1">{{ field.help_text }}</p>
            {% endif %}
            {% if field.errors %}
            <div class="errorlist">{{ field.errors }}</div>
            {% endif %}
        </div>
        {% endfor %}

        <button type="submit" class="btn-primary max-w-xs">Create company</button>
    </form>
</div>
