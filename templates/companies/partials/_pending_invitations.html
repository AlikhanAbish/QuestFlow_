{% if pending_invitations %}
<div class="overflow-hidden rounded-xl border border-white/5">
    <table class="min-w-full divide-y divide-white/5">
        <thead class="bg-white/5">
            <tr>
                <th class="px-4 py-3 text-left text-xs font-semibold text-gray-400 uppercase tracking-wider">Email</th>
                <th class="px-4 py-3 text-left text-xs font-semibold text-gray-400 uppercase tracking-wider">Role</th>
                <th class="px-4 py-3 text-left text-xs font-semibold text-gray-400 uppercase tracking-wider">Expires</th>
                <th class="px-4 py-3 text-right text-xs font-semibold text-gray-400 uppercase tracking-wider">Actions</th>
            </tr>
        </thead>
        <tbody class="divide-y divide-white/5">
            {% for inv in pending_invitations %}
            <tr id="invitation-row-{{ inv.pk }}" class="hover:bg-white/[0.02] transition-colors">
                <td class="px-4 py-3 text-sm text-gray-200">{{ inv.email }}</td>
                <td class="px-4 py-3 text-sm text-gray-400">{{ inv.get_role_display }}</td>
                <td class="px-4 py-3 text-sm text-gray-400">{{ inv.expires_at|date:"M j, Y" }}</td>
                <td class="px-4 py-3 text-right">
                    <form method="post"
                          hx-post="{% url 'companies:invitation_send' inv.pk %}"
                          hx-target="#pending-invitations-container"
                          hx-swap="innerHTML"
                          hx-indicator="#resend-spinner-{{ inv.pk }}"
                          class="inline">
                        {% csrf_token %}
                        <button type="submit"
                                class="inline-flex items-center gap-2 px-3 py-1.5 text-xs font-semibold rounded-lg border border-white/10 bg-white/5 text-gray-300 hover:bg-white/10 hover:text-white transition-colors">
                            <svg id="resend-spinner-{{ inv.pk }}" class="htmx-indicator w-3.5 h-3.5 animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                            Resend
                        </button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% else %}
<p class="text-sm text-gray-500 py-4">No pending invitations.</p>
{% endif %}
