<div id="company-settings-form">
<form hx-post="{% url 'companies:company_update' %}"
      hx-target="#company-settings-form"
      hx-swap="outerHTML"
      class="space-y-5">
    {% csrf_token %}

    {% if saved %}
    <div class="p-3 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-sm text-emerald-400">
        Settings saved successfully.
    </div>
    {% endif %}

    {% for field in form %}
    <div>
        <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}
        <div class="errorlist">{{ field.errors }}</div>
        {% endif %}
    </div>
    {% endfor %}

    <button type="submit" class="btn-primary max-w-xs">Save changes</button>
</form>
</div>
