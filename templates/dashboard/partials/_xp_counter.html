<div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 p-6 flex items-center gap-6"
     x-data="{ progress: 0 }"
     x-init="setTimeout(() => progress = {{ progress_percent }}, 300)">
    
    <!-- Level Display (Emerald) -->
    <div class="relative flex-shrink-0">
        <div class="w-20 h-20 rounded-full flex items-center justify-center bg-emerald-100 dark:bg-emerald-900/30 border-4 border-emerald-500 shadow-[0_0_15px_rgba(16,185,129,0.3)]
            {% if has_recent_levelup %} animate-pulse {% endif %}">
            <div class="text-center">
                <span class="block text-xs font-semibold text-emerald-600 dark:text-emerald-400 uppercase tracking-wider">Lvl</span>
                <span class="block text-2xl font-bold text-emerald-700 dark:text-emerald-300">{{ level }}</span>
            </div>
        </div>
        
        <!-- Streak Indicator (Orange) -->
        {% if streak > 0 %}
        <div class="absolute -bottom-2 -right-2 bg-orange-500 text-white text-xs font-bold px-2 py-1 rounded-full shadow border-2 border-white dark:border-slate-800 flex items-center gap-1"
             x-data="{ pulse: true }" x-init="setInterval(() => pulse = !pulse, 1500)">
            <svg class="w-3 h-3" :class="pulse ? 'scale-110' : 'scale-100'" style="transition: transform 0.3s ease-in-out;" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" d="M12.395 2.553a1 1 0 00-1.45-.385c-.345.23-.614.558-.822.88-.214.33-.403.713-.57 1.116-.334.804-.614 1.768-.84 2.734a31.365 31.365 0 00-.613 3.58 2.64 2.64 0 01-.945-1.067c-.328-.68-.398-1.534-.398-2.654A1 1 0 005.05 6.05 6.981 6.981 0 003 11a7 7 0 1011.95-4.95c-.592-.591-.98-.985-1.348-1.467-.363-.476-.724-1.063-1.207-2.03zM12.12 15.12A3 3 0 017 13s.879.5 2.5.5c0-1 .5-4 1.25-4.5.5 1 .786 1.293 1.371 1.879A2.99 2.99 0 0113 13a2.99 2.99 0 01-.879 2.121z" clip-rule="evenodd"></path></svg>
            {{ streak }}
        </div>
        {% endif %}
    </div>

    <!-- XP Progress (Amber) -->
    <div class="flex-grow">
        <div class="flex justify-between items-end mb-2">
            <div>
                <h3 class="text-sm font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider">Experience</h3>
                <p class="text-2xl font-bold text-slate-800 dark:text-white">
                    <span class="text-amber-600">{{ xp_total }}</span> 
                    <span class="text-sm font-medium text-slate-400">XP</span>
                </p>
            </div>
            <div class="text-right">
                <span class="text-xs text-slate-500 dark:text-slate-400">Next Level</span>
                <p class="text-sm font-semibold text-slate-700 dark:text-slate-300">{{ xp_next_level }} XP</p>
            </div>
        </div>
        
        <!-- Progress Bar -->
        <div class="h-3 w-full bg-slate-100 dark:bg-slate-700 rounded-full overflow-hidden shadow-inner">
            <div class="h-full bg-amber-600 rounded-full transition-all duration-1000 ease-out relative"
                 :style="`width: ${progress}%`">
                 <div class="absolute top-0 right-0 bottom-0 left-0 bg-white/20" x-show="progress > 0" x-transition.opacity.duration.1000ms></div>
            </div>
        </div>
        
        <div class="mt-2 text-xs text-slate-500 flex justify-between">
            <span>Weekly XP: <span class="font-semibold text-amber-600">{{ xp_weekly }}</span></span>
            <span>{{ progress_percent }}% to Lvl {{ level|add:1 }}</span>
        </div>
    </div>
</div>
