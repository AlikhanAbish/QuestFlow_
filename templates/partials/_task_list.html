            </svg>
            <h3 class="mt-3 text-sm font-semibold text-white">No tasks found</h3>
            <p class="mt-1 text-sm text-zinc-400">Try adjusting your filters or create a new task.</p>
        </div>
    {% endfor %}
</div>
