<div class="bg-gray-50 dark:bg-gray-700/30 p-5 rounded-xl border border-gray-100 dark:border-gray-600 shadow-sm transition hover:shadow-md" x-data="{ value: null }">
    <label class="block text-base font-medium text-gray-800 dark:text-gray-200 mb-4">{{ label }}</label>
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mt-2">
        <span class="text-xs text-gray-500 dark:text-gray-400 font-semibold uppercase tracking-wider hidden sm:block">Never (0)</span>
        <div class="flex justify-between sm:justify-center w-full sm:w-auto gap-1 sm:gap-3">
            {% for i in "0123456"|make_list %}
            <label class="cursor-pointer flex flex-col items-center">
                <input type="radio" name="{{ field.html_name }}" value="{{ i }}" x-model="value" class="sr-only" {% if disabled %}disabled{% endif %} required>
                <div :class="value == '{{ i }}' ? 'bg-indigo-600 text-white border-indigo-600 shadow-md transform scale-110' : 'bg-white text-gray-700 border-gray-300 dark:bg-gray-800 dark:text-gray-300 dark:border-gray-500 hover:bg-indigo-50 dark:hover:bg-indigo-900/50'" 
                     class="w-10 h-10 flex items-center justify-center rounded-full border transition-all duration-200 ease-in-out font-medium text-sm">
                    {{ i }}
                </div>
            </label>
            {% endfor %}
        </div>
        <span class="text-xs text-gray-500 dark:text-gray-400 font-semibold uppercase tracking-wider hidden sm:block">Every day (6)</span>
    </div>
    <div class="flex justify-between sm:hidden mt-2 px-2 text-[10px] text-gray-400 uppercase font-semibold">
        <span>Never</span>
        <span>Every day</span>
    </div>
    {% if field.errors %}
    <p class="mt-2 text-sm text-red-600 dark:text-red-400">{{ field.errors.0 }}</p>
    {% endif %}
</div>
