<div class="w-80 flex-shrink-0 flex flex-col rounded-2xl border border-white/10 {{ color_class }} max-h-full shadow-lg shadow-black/20">
    <div class="p-3 border-b border-white/10 flex justify-between items-center">
        <h3 class="font-semibold text-sm {{ text_class }} flex items-center">
            {{ column_title }}
            <span class="ml-2 {{ badge_class|default:'bg-white/10 text-zinc-300' }} text-xs px-2 py-0.5 rounded-full font-medium">{{ tasks|length }}</span>
        </h3>
    </div>

    <div class="p-3 flex-1 overflow-y-auto kanban-list min-h-[200px]" data-status="{{ column_status }}">
        {% csrf_token %}
        {% for task in tasks %}
            {% include "partials/_task_card.html" %}
        {% empty %}
            <div class="text-center py-6 text-sm text-zinc-500 italic">
                Drop tasks here
            </div>
        {% endfor %}
    </div>
</div>
