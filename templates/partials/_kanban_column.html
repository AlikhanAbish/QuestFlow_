<div class="w-80 flex-shrink-0 flex flex-col rounded-xl border border-gray-200 dark:border-gray-700 {{ color_class }} max-h-full">
    <div class="p-3 border-b border-gray-200 dark:border-gray-700 flex justify-between items-center">
        <h3 class="font-semibold text-sm {{ text_class }} flex items-center">
            {{ column_title }}
            <span class="ml-2 bg-white dark:bg-gray-800 text-xs px-2 py-0.5 rounded-full shadow-sm">{{ tasks|length }}</span>
        </h3>
    </div>
    
    <div class="p-3 flex-1 overflow-y-auto kanban-list min-h-[200px]" data-status="{{ column_status }}">
        {% csrf_token %}
        {% for task in tasks %}
            {% include "partials/_task_card.html" %}
        {% empty %}
            <div class="text-center py-6 text-sm text-gray-500 dark:text-gray-400 italic">
                Drop tasks here
            </div>
        {% endfor %}
    </div>
</div>
