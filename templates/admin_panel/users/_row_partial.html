<td class="px-6 py-4 whitespace-nowrap">
    <div class="flex items-center">
        <div class="ml-4">
            <div class="text-sm font-medium text-gray-900 dark:text-white">{{ user.first_name }} {{ user.last_name }}</div>
            <div class="text-sm text-gray-500 dark:text-gray-400">{{ user.email }}</div>
        </div>
    </div>
</td>
<td class="px-6 py-4 whitespace-nowrap">
    <div class="text-sm text-gray-900 dark:text-white">{{ user.company.name|default:"-" }}</div>
</td>
<td class="px-6 py-4 whitespace-nowrap">
    <form hx-post="{% url 'admin_panel:user-role' user.pk %}" hx-target="#user-row-{{ user.pk }}" hx-swap="outerHTML">
        {% csrf_token %}
        <select name="role" onchange="this.form.dispatchEvent(new Event('submit'))" class="text-sm border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 dark:bg-gray-700 dark:border-gray-600 dark:text-white">
            <option value="employee" {% if user.role == 'employee' %}selected{% endif %}>Employee</option>
            <option value="manager" {% if user.role == 'manager' %}selected{% endif %}>Manager</option>
            <option value="admin" {% if user.role == 'admin' %}selected{% endif %}>Admin</option>
        </select>
    </form>
</td>
<td class="px-6 py-4 whitespace-nowrap">
    <div class="flex items-center space-x-2">
        {% if user.is_active %}
        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">Active</span>
        <button hx-post="{% url 'admin_panel:user-deactivate' user.pk %}"
                hx-target="#user-row-{{ user.pk }}"
                hx-swap="outerHTML"
                hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
                class="text-xs text-red-600 hover:text-red-900 ml-2">Deactivate</button>
        {% else %}
        <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-red-100 text-red-800">Inactive</span>
        <button hx-post="{% url 'admin_panel:user-deactivate' user.pk %}"
                hx-target="#user-row-{{ user.pk }}"
                hx-swap="outerHTML"
                hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
                class="text-xs text-green-600 hover:text-green-900 ml-2">Activate</button>
        {% endif %}
    </div>
</td>
