{% extends "admin_panel/base_admin.html" %}

{% block admin_content %}
<div class="flex justify-between items-center mb-6">
    <h1 class="text-3xl font-semibold text-gray-800 dark:text-white">Users</h1>
</div>

<div class="mb-4">
    <input type="text" 
           name="q" 
           hx-get="{% url 'admin_panel:user-list' %}" 
           hx-trigger="keyup changed delay:500ms" 
           hx-target="#user-list" 
           placeholder="Search users by email..." 
           class="w-full md:w-1/3 px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:bg-gray-800 dark:border-gray-700 dark:text-white">
</div>

<div class="bg-white dark:bg-gray-800 rounded-lg shadow-md overflow-hidden">
    <table class="min-w-full divide-y divide-gray-200 dark:divide-gray-700">
        <thead class="bg-gray-50 dark:bg-gray-700">
            <tr>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">User</th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Company</th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Role</th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Status</th>
            </tr>
        </thead>
        <tbody id="user-list" class="bg-white dark:bg-gray-800 divide-y divide-gray-200 dark:divide-gray-700">
            {% include "admin_panel/users/_list_partial.html" %}
        </tbody>
    </table>
</div>
{% endblock %}
