{% extends "admin_panel/base_admin.html" %}

{% block admin_content %}
<h1 class="text-3xl font-semibold text-gray-800 dark:text-white mb-6">Gamification Rules</h1>

<div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-6 max-w-3xl">
    <form method="post" action="{% url 'admin_panel:gamification-rules-update' %}">
        {% csrf_token %}
        <div class="space-y-4">
            {% for rule in rules %}
            <div class="flex items-center justify-between border-b border-gray-200 dark:border-gray-700 pb-4">
                <div>
                    <h3 class="text-lg font-medium text-gray-900 dark:text-white">{{ rule.name }}</h3>
                    <p class="text-sm text-gray-500 dark:text-gray-400">{{ rule.description }}</p>
                </div>
                <div class="w-32">
                    <label for="rule_{{ rule.pk }}" class="sr-only">Points</label>
                    <input type="number" id="rule_{{ rule.pk }}" name="rule_{{ rule.pk }}" value="{{ rule.points }}"
                           class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm dark:bg-gray-700 dark:border-gray-600 dark:text-white">
                </div>
            </div>
            {% empty %}
            <p class="text-gray-500 dark:text-gray-400">No gamification rules defined yet.</p>
            {% endfor %}
        </div>
        
        <div class="mt-6 flex justify-end">
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-6 rounded focus:outline-none focus:shadow-outline">
                Save Rules
            </button>
        </div>
    </form>
</div>
{% endblock %}
