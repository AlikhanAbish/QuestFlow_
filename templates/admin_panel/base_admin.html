{% extends "base.html" %}

{% block content %}
<div class="flex h-screen bg-gray-50 dark:bg-gray-900">
    <!-- Sidebar -->
    <aside class="w-64 bg-white dark:bg-gray-800 shadow-md">
        <div class="p-6">
            <h2 class="text-2xl font-bold text-gray-800 dark:text-white">Admin Panel</h2>
        </div>
        <nav class="mt-6">
            <a href="{% url 'admin_panel:dashboard' %}" class="block py-2.5 px-4 rounded transition duration-200 hover:bg-indigo-500 hover:text-white text-gray-700 dark:text-gray-300">
                Dashboard
            </a>
            <a href="{% url 'admin_panel:company-list' %}" class="block py-2.5 px-4 rounded transition duration-200 hover:bg-indigo-500 hover:text-white text-gray-700 dark:text-gray-300">
                Companies
            </a>
            <a href="{% url 'admin_panel:user-list' %}" class="block py-2.5 px-4 rounded transition duration-200 hover:bg-indigo-500 hover:text-white text-gray-700 dark:text-gray-300">
                Users
            </a>
            <a href="{% url 'admin_panel:gamification-settings' %}" class="block py-2.5 px-4 rounded transition duration-200 hover:bg-indigo-500 hover:text-white text-gray-700 dark:text-gray-300">
                Gamification Rules
            </a>
            <a href="{% url 'admin_panel:gamification-badges' %}" class="block py-2.5 px-4 rounded transition duration-200 hover:bg-indigo-500 hover:text-white text-gray-700 dark:text-gray-300">
                Badges
            </a>
            <a href="{% url 'admin_panel:audit-log' %}" class="block py-2.5 px-4 rounded transition duration-200 hover:bg-indigo-500 hover:text-white text-gray-700 dark:text-gray-300">
                Audit Log
            </a>
            <a href="{% url 'admin_panel:system-settings' %}" class="block py-2.5 px-4 rounded transition duration-200 hover:bg-indigo-500 hover:text-white text-gray-700 dark:text-gray-300">
                System Settings
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-50 dark:bg-gray-900 p-8">
        {% block admin_content %}
        {% endblock %}
    </main>
</div>
{% endblock %}
