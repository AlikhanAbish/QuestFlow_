{% extends "admin_panel/base_admin.html" %}

{% block admin_content %}
<div class="flex justify-between items-center mb-6">
    <h1 class="text-3xl font-semibold text-gray-800 dark:text-white">Companies</h1>
    <a href="{% url 'admin_panel:company-create' %}" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded">
        + Add Company
    </a>
</div>

<div class="mb-4">
    <input type="text" 
           name="q" 
           hx-get="{% url 'admin_panel:company-list' %}" 
           hx-trigger="keyup changed delay:500ms" 
           hx-target="#company-list" 
           placeholder="Search companies..." 
           class="w-full md:w-1/3 px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 dark:bg-gray-800 dark:border-gray-700 dark:text-white">
</div>

<div class="bg-white dark:bg-gray-800 rounded-lg shadow-md overflow-hidden">
    <table class="min-w-full divide-y divide-gray-200 dark:divide-gray-700">
        <thead class="bg-gray-50 dark:bg-gray-700">
            <tr>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Name</th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Users</th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Status</th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 dark:text-gray-300 uppercase tracking-wider">Actions</th>
            </tr>
        </thead>
        <tbody id="company-list" class="bg-white dark:bg-gray-800 divide-y divide-gray-200 dark:divide-gray-700">
            {% include "admin_panel/companies/_list_partial.html" %}
        </tbody>
    </table>
</div>
{% endblock %}
