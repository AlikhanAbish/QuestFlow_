{% for company in companies %}
<tr>
    <td class="px-6 py-4 whitespace-nowrap">
        <div class="text-sm font-medium text-gray-900 dark:text-white">{{ company.name }}</div>
        <div class="text-sm text-gray-500 dark:text-gray-400">{{ company.slug }}</div>
    </td>
    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 dark:text-gray-400">
        {{ company.user_count }} / {{ company.max_users }}
    </td>
    <td class="px-6 py-4 whitespace-nowrap" id="status-{{ company.pk }}">
        {% include "admin_panel/companies/_status_partial.html" %}
    </td>
    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
        <a href="{% url 'admin_panel:company-detail' company.pk %}" class="text-indigo-600 hover:text-indigo-900 dark:text-indigo-400 mr-3">View</a>
    </td>
</tr>
{% empty %}
<tr>
    <td colspan="4" class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 dark:text-gray-400 text-center">
        No companies found.
    </td>
</tr>
{% endfor %}
