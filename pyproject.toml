[project]
name = "questflow"
version = "0.1.0"
description = "Gamified Productivity Platform for Remote & Hybrid Teams"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1",
    "psycopg[binary]>=3.2",
    "django-redis>=5.4.0",
    "celery[redis]>=5.4.0",
    "django-celery-beat>=2.7.0",
    "channels[daphne]>=4.1.0",
    "django-htmx>=1.21.0",
    "python-telegram-bot>=21.0.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "django-filter>=24.3",
    "django-axes>=7.0.0",
    "django-csp>=3.8",
    "pillow>=11.0.0",
    "sentry-sdk[django]>=2.0.0",
    "python-dotenv>=1.0.0",
    "djangorestframework>=3.15.0",
    "django-debug-toolbar>=6.3.0",
    "gunicorn>=22.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-django>=4.9.0",
    "factory-boy>=3.3.0",
    "django-debug-toolbar>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.7.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.development"
python_files = ["tests.py", "test_*.py", "*_tests.py"]

[tool.ruff]
line-length = 120
extend-exclude = ["migrations", "static", "media"]

[tool.mypy]
ignore_missing_imports = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "config.settings.development"
